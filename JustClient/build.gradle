import proguard.gradle.ProGuardTask

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.4.2'
        classpath 'com.yworks:yguard:4.1.0'
    }
}

plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation 'io.netty:netty-codec-socks:4.1.82.Final'
    implementation 'io.netty:netty-handler-proxy:4.1.82.Final'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.compilerArgs += ['-g:none']
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// ============================================================
// PROGUARD - FABRIC 1.21.4 UYUMLU
// ============================================================

afterEvaluate {

    task proguardJar(type: ProGuardTask, dependsOn: remapJar) {

        injars remapJar.archiveFile
        outjars "${buildDir}/libs/justclient-protected.jar"

        configuration file("proguard.pro")

        // Java runtime modules
        def javaHome = System.getProperty('java.home')
        libraryjars "${javaHome}/jmods/java.base.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
        libraryjars "${javaHome}/jmods/java.desktop.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
        libraryjars "${javaHome}/jmods/java.logging.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
        libraryjars "${javaHome}/jmods/java.sql.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
        libraryjars "${javaHome}/jmods/java.xml.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
        libraryjars "${javaHome}/jmods/java.naming.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
        libraryjars "${javaHome}/jmods/java.management.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
        libraryjars "${javaHome}/jmods/jdk.unsupported.jmod", jarfilter: '!**.jar', filter: '!module-info.class'

        // Minecraft + Fabric dependencies
        configurations.runtimeClasspath.files.each { file ->
            libraryjars file, filter: '!module-info.class,!META-INF/versions/**'
        }

        verbose()

        doFirst {
            println ""
            println "============================================"
            println " PROGUARD OBFUSCATION"
            println "============================================"
        }

    }

    task proguardSuccess {
        dependsOn proguardJar
        doLast {
            System.out.println("")
            System.out.println("============================================")
            System.out.println("=                                          =")
            System.out.println("=    [OK] OBFUSCATION BASARILI!            =")
            System.out.println("=    justclient-protected.jar HAZIR        =")
            System.out.println("=                                          =")
            System.out.println("============================================")
            System.out.println("")
        }
    }

    // ProGuard'sız basit JAR
    task createSimpleJar(type: Copy, dependsOn: remapJar) {
        from remapJar.archiveFile
        into "${buildDir}/libs"
        rename { "justclient-protected.jar" }
    }

    // Default build - UltraProtect ZATEN AKTIF
    build.finalizedBy(createSimpleJar)

    // ONERILEN BUILD - harici obfuscator YOK, UltraProtect VAR
    task buildFinal(type: Copy, dependsOn: remapJar) {
        from remapJar.archiveFile
        into "${buildDir}/libs"
        rename { "justclient-final.jar" }
        doLast {
            println ""
            println "============================================"
            println " [OK] justclient-final.jar HAZIR"
            println ""
            println " KORUMA: UltraProtect AKTIF"
            println " - String Encryption"
            println " - Anti-Debug"
            println " - Runtime Protection"
            println "============================================"
        }
    }

    // TEMIZ JAR - test icin
    task buildClean(type: Copy, dependsOn: remapJar) {
        from remapJar.archiveFile
        into "${buildDir}/libs"
        rename { "justclient-clean.jar" }
        doLast {
            println "[OK] justclient-clean.jar HAZIR (obfuscation YOK)"
        }
    }
}

// Kısayollar
task buildObf { dependsOn 'proguardSuccess' }
task buildSimple { dependsOn 'createSimpleJar' }

// ============================================================
// SKIDFUSCATOR - FABRIC & TLAUNCHER UYUMLU
// ============================================================
// Kurulum:
// 1. https://github.com/skidfuscatordev/skidfuscator-java-obfuscator/releases
// 2. skidfuscator.jar dosyasini proje kokune koy
// 3. ./gradlew buildSkid
// ============================================================

task skidfuscate(dependsOn: remapJar) {
    doLast {
        def skidfuscatorJar = file("skidfuscator.jar")
        def inputJar = remapJar.archiveFile.get().asFile
        def outputJar = file("${buildDir}/libs/justclient-skid.jar")
        def configFile = file("skid-config.hocon")
        def exemptFile = file("skidfuscator-exempt.txt")

        // Skidfuscator JAR kontrolu
        if (!skidfuscatorJar.exists()) {
            println ""
            println "============================================"
            println " [HATA] skidfuscator.jar BULUNAMADI!"
            println "============================================"
            println ""
            println " Kurulum:"
            println " 1. GitHub'dan indir:"
            println "    https://github.com/skidfuscatordev/skidfuscator-java-obfuscator/releases"
            println ""
            println " 2. skidfuscator.jar dosyasini buraya koy:"
            println "    ${projectDir}${File.separator}skidfuscator.jar"
            println ""
            println " 3. Tekrar calistir: gradlew buildSkid"
            println "============================================"
            throw new GradleException("skidfuscator.jar bulunamadi!")
        }

        println ""
        println "============================================"
        println " SKIDFUSCATOR OBFUSCATION"
        println " Fabric & TLauncher Uyumlu Config"
        println "============================================"
        println ""
        println " Input:  ${inputJar.name}"
        println " Output: ${outputJar.name}"
        println " Config: ${configFile.name}"
        println ""
        println " ACIK OZELLIKLER:"
        println "   [+] String Encryption (STANDARD)"
        println "   [+] Number Encryption"
        println "   [+] Flow Condition (LIGHT)"
        println "   [+] Flow Switch (LIGHT)"
        println "   [+] Local Variable Rename"
        println "   [+] Dead Code (LOW)"
        println ""
        println " KAPALI (Guvenlik icin):"
        println "   [-] InvokeDynamic"
        println "   [-] Reflection Breaking"
        println "   [-] ClassLoader Tricks"
        println "   [-] Anti-JVM"
        println "   [-] Stack Frame Destroy"
        println "   [-] Bootstrap Methods Hack"
        println "============================================"
        println ""

        // Skidfuscator calistir
        exec {
            workingDir projectDir
            commandLine 'java', '-Xmx2G', '-jar', skidfuscatorJar.absolutePath,
                'obfuscate',
                inputJar.absolutePath,
                '-o', outputJar.absolutePath,
                '-cfg', configFile.absolutePath,
                '-ex', exemptFile.absolutePath,
                '-notrack',
                '-fuckit'

            ignoreExitValue = true
        }

        if (outputJar.exists()) {
            println ""
            println "============================================"
            println " [OK] SKIDFUSCATOR BASARILI!"
            println "============================================"
            println ""
            println " Cikti: build/libs/justclient-skid.jar"
            println ""
            println " TLauncher'da test et:"
            println " 1. mods/ klasorune kopyala"
            println " 2. Fabric 1.21.x ile baslat"
            println "============================================"
        } else {
            println ""
            println "[UYARI] Skidfuscator cikti olusturamadi!"
            println "        Clean JAR kopyalaniyor..."
            println ""

            copy {
                from inputJar
                into outputJar.parentFile
                rename { outputJar.name }
            }
            println " Cikti: build/libs/justclient-skid.jar (clean)"
        }
    }
}

// Skidfuscator ile build
task buildSkid { dependsOn 'skidfuscate' }

