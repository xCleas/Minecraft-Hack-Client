// ============================================================
// YGUARD OBFUSCATION - FABRIC UYUMLU (DUZELTILMIS)
// ============================================================
task yguardObfuscate(dependsOn: remapJar) {
    doLast {
        ant.taskdef(
            name: 'yguard',
            classname: 'com.yworks.yguard.YGuardTask',
            classpath: buildscript.configurations.classpath.asPath
        )

        def inputJar = remapJar.archiveFile.get().asFile
        def outputJar = file("${buildDir}/libs/justclient-yguard.jar")

        ant.yguard {
            inoutpair(in: inputJar, out: outputJar)

            // Minecraft ve Fabric dependency'lerini external olarak ekle
            externalclasses {
                configurations.runtimeClasspath.files.each { file ->
                    pathelement(location: file.absolutePath)
                }
            }

            rename(mainclass: "dev.just.JustClient", logfile: "${buildDir}/yguard-rename.log") {

                // Property ayarları - Minecraft class'ları resolve edilemiyor, ignore
                property(name: "error-checking", value: "ignore")
                property(name: "naming-scheme", value: "mix")
                property(name: "language-conformity", value: "compatible")

                // KEEP - Korunacaklar
                keep {
                    // Mixin - Fabric için KRİTİK, ASLA rename edilmemeli
                    'package'(name: "dev.just.mixin")

                    // JustClient - Fabric entrypoint
                    'class'(name: "dev.just.JustClient")

                    // Protect paketi
                    'package'(name: "dev.just.protect")

                    // Manager paketi
                    'package'(name: "dev.just.manager")

                    // Screens paketi
                    'package'(name: "dev.just.screens")

                    // Setting classes
                    'package'(name: "dev.just.modules.setting")

                    // Core module classes
                    'class'(name: "dev.just.modules.FunctionAnnotation")
                    'class'(name: "dev.just.modules.Function")
                    'class'(name: "dev.just.modules.FunctionManager", methods: "public", fields: "public")
                    'class'(name: "dev.just.modules.Type", methods: "public", fields: "public")

                    // Fabric/Sponge/Mixin libraries
                    'class'(name: "net.fabricmc.**")
                    'class'(name: "org.spongepowered.**")
                    'class'(name: "com.llamalad7.**")
                }
            }
        }

        println ""
        println "════════════════════════════════════════════════"
        println "  [OK] yGuard OBFUSCATION TAMAMLANDI"
        println "════════════════════════════════════════════════"
        println ""
        println "  ✅ JustClient korundu"
        println "  ✅ Mixin exempt"
        println "  ✅ Protect korundu"
        println "  ✅ Manager/Setting korundu"
        println ""
        println "  🔒 combat/** → RENAMED"
        println "  🔒 movement/** → RENAMED"
        println "  🔒 render/** → RENAMED"
        println "  🔒 misc/** → RENAMED"
        println "  🔒 player/** → RENAMED"
        println "  🔒 util/** → RENAMED"
        println "  🔒 events/** → RENAMED"
        println ""
        println "  Çıktı: ${outputJar}"
        println "════════════════════════════════════════════════"
    }
}

task buildYGuard { dependsOn 'yguardObfuscate' }

